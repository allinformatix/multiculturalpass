---
name: destroy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Isolated deployment environment
        type: choice
        options: [dev, stg, prd]
        required: true
      confirmation:
        description: 'Exact project-environment:apply, :restore or :destroy confirmation'
        type: string
        required: true
      allow_production_destroy:
        description: Explicitly allow production teardown (provider deletion protection still applies)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  deployments: read
jobs:
  operation:
    uses: ./.github/workflows/_operate.yml
    with:
      environment: ${{ inputs.environment }}
      operation: destroy
      confirmation: ${{ inputs.confirmation }}
      allow_production_destroy: ${{ inputs.allow_production_destroy }}
    secrets: inherit
