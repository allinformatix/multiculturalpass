---
name: deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Isolated deployment environment
        type: choice
        options: [dev, stg, prd]
        required: true
      confirmation:
        description: 'Exact project-environment:apply, :restore or :destroy confirmation'
        type: string
        required: true
permissions:
  contents: read
  actions: read
  deployments: read
jobs:
  operation:
    uses: ./.github/workflows/_operate.yml
    with:
      environment: ${{ inputs.environment }}
      operation: deploy
      confirmation: ${{ inputs.confirmation }}
    secrets: inherit
