---
- name: Reload SSH
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  notify: Restart SSH service
- name: Restart SSH service
  ansible.builtin.service:
    name: ssh
    state: restarted
- name: Restart journal
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
