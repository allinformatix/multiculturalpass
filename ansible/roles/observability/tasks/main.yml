---
- name: Inspect existing Alloy service
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/alloy.service
  register: observability_service_file
- name: Stop disabled collector
  ansible.builtin.systemd_service:
    name: alloy
    state: stopped
    enabled: false
  when:
    - not observability_enabled
    - observability_service_file.stat.exists
- name: Configure enabled collector
  when: observability_enabled
  block:
    - name: Validate Grafana credentials
      ansible.builtin.assert:
        that:
          - lookup('env', 'GRAFANA_CLOUD_LOKI_USER') | length > 0
          - lookup('env', 'GRAFANA_CLOUD_LOKI_TOKEN') | length >= 16
      no_log: true
    - name: Ensure keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
    - name: Install Grafana repository signing key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg-full.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: '0644'
    - name: Configure signed Grafana repository
      ansible.builtin.deb822_repository:
        name: grafana
        types: [deb]
        uris: https://apt.grafana.com
        suites: [stable]
        components: [main]
        signed_by: /etc/apt/keyrings/grafana.asc
        state: present
    - name: Install pinned Alloy
      ansible.builtin.apt:
        name: 'alloy={{ alloy_version }}'
        policy_rc_d: 101
        state: present
        update_cache: true
      notify: Restart Alloy
    - name: Grant read access to supported log sources
      ansible.builtin.user:
        name: alloy
        groups: [adm, systemd-journal]
        append: true
      notify: Restart Alloy
    - name: Ensure collector configuration directory
      ansible.builtin.file:
        path: /etc/alloy
        state: directory
        owner: root
        group: alloy
        mode: '0750'
    - name: Install Loki credential without placing it in agent arguments
      ansible.builtin.copy:
        dest: /etc/alloy/loki-token
        content: "{{ lookup('env', 'GRAFANA_CLOUD_LOKI_TOKEN') }}"
        owner: root
        group: alloy
        mode: '0640'
      no_log: true
      notify: Restart Alloy
    - name: Render and validate collector configuration before activation
      ansible.builtin.template:
        src: config.alloy.j2
        dest: /etc/alloy/config.alloy
        owner: root
        group: alloy
        mode: '0640'
        validate: /usr/bin/alloy validate %s
      no_log: true
      notify: Restart Alloy
    - name: Ensure systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/alloy.service.d
        state: directory
        mode: '0755'
    - name: Restrict collector resources and privileges
      ansible.builtin.copy:
        dest: /etc/systemd/system/alloy.service.d/odoo.conf
        mode: '0644'
        content: |
          [Service]
          User=alloy
          Group=alloy
          SupplementaryGroups=adm systemd-journal
          Environment=GOMEMLIMIT=160MiB
          MemoryMax={{ observability_memory_limit }}
          CPUQuota=20%
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          PrivateTmp=true
          ReadWritePaths=/var/lib/alloy
          Restart=on-failure
          RestartSec=10s
      notify: Restart Alloy
    - name: Configure loopback management endpoint and persistent collector positions
      ansible.builtin.copy:
        dest: /etc/default/alloy
        mode: '0644'
        content: |
          CONFIG_FILE="/etc/alloy/config.alloy"
          CUSTOM_ARGS="--server.http.listen-addr=127.0.0.1:12345 --storage.path=/var/lib/alloy --disable-reporting --server.http.enable-pprof=false --server.http.disable-support-bundle"
      notify: Restart Alloy
    - name: Ensure state directory
      ansible.builtin.file:
        path: /var/lib/alloy
        state: directory
        owner: alloy
        group: alloy
        mode: '0750'
    - name: Apply collector changes
      ansible.builtin.meta: flush_handlers
    - name: Start collector
      ansible.builtin.systemd_service:
        name: alloy
        state: started
        enabled: true
        daemon_reload: true
    - name: Verify collector readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:12345/-/ready
        status_code: 200
      register: observability_health
      retries: 12
      delay: 5
      until: observability_health.status == 200
