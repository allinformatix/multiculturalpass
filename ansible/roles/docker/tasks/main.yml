---
- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
- name: Fetch Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
- name: Configure official Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: [noble]
    components: [stable]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: true
- name: Create daemon configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'
- name: Limit container logs
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: '{"log-driver":"local","log-opts":{"max-size":"10m","max-file":"3"},"live-restore":true}'
    mode: '0644'
  notify: Restart Docker
- name: Start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
